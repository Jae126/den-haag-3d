<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Den Haag 3D Projection Map</title>
    <!-- ArcGIS Maps SDK for JavaScript 4.x -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
    <script src="https://js.arcgis.com/4.31/"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #020617;
            overflow: hidden;
        }
        #viewDiv {
            position: absolute;
            inset: 0;
        }
    </style>
</head>
<body>
    <!-- ArcGIS Map View Container -->
    <div id="viewDiv"></div>

    <script>
        require([
            "esri/WebMap",
            "esri/views/MapView"
        ], function(WebMap, MapView) {
            
            // ============================================
            // Initialize ArcGIS WebMap
            // ============================================
            
            // Load the webmap using the portal item ID
            const map = new WebMap({
                portalItem: {
                    id: "49e3c991aa71437595e52f9b68ce5d1d"
                }
            });

            // Create the map view
            const view = new MapView({
                container: "viewDiv",
                map: map,
                // Center on The Hague
                center: [4.30, 52.08],
                zoom: 12
            });

            // ============================================
            // Layer Mapping: Store references to ArcGIS layers
            // ============================================
            
            // Dictionary to store layer references by layerKey
            // This maps the layerKey sent from index.html to the actual ArcGIS layer object
            const layerMap = {};

            // Wait for the map to load, then find and store layer references
            map.when(() => {
                console.log("ArcGIS WebMap loaded successfully");

                // ============================================
                // DEBUG: Log all layers and sublayers
                // ============================================
                console.log("=== ALL LAYERS DEBUG ===");
                console.log("ALL LAYERS:", map.allLayers.toArray().map(l => ({
                    title: l.title,
                    id: l.id,
                    type: l.type,
                    visible: l.visible
                })));

                // Check for sublayers in group layers and MapImageLayers
                map.allLayers.forEach(l => {
                    if (l.sublayers) {
                        console.log(`SUBLAYERS of "${l.title}" (${l.type}):`, l.sublayers.toArray().map(s => ({
                            title: s.title,
                            id: s.id,
                            visible: s.visible
                        })));
                    }
                    // Some layers might have layers property instead
                    if (l.layers && l.layers.length > 0) {
                        console.log(`LAYERS in "${l.title}" (${l.type}):`, l.layers.toArray().map(s => ({
                            title: s.title,
                            id: s.id,
                            visible: s.visible
                        })));
                    }
                });
                console.log("=== END DEBUG ===");

                // Find each relevant layer by its title and store in layerMap
                // These layerKeys match what index.html will send in postMessage
                const bomenLayer = map.allLayers.find(l => l.title === "Bomen");
                const heatLayer = map.allLayers.find(l => l.title === "Hittestress");
                const ovLayer = map.allLayers.find(l => l.title === "Openbaar Vervoer Nederland");
                const trafficLayer = map.allLayers.find(l => l.title === "Traffic");
                const constructionLayer = map.allLayers.find(l => l.title === "Construction");
                const noiseLayer = map.allLayers.find(l => l.title === "Noise pollution");
                const popDensityLayer = map.allLayers.find(l => l.title === "The Hague population density");

                // Find Traffic & Road Closures layer - check both top-level and sublayers
                let trafficRoadClosuresLayer = map.allLayers.find(l => l.title === "Traffic & Road Closures");
                
                // If not found at top level, search in sublayers
                if (!trafficRoadClosuresLayer) {
                    // Search through all layers that have sublayers
                    for (const layer of map.allLayers.toArray()) {
                        if (layer.sublayers) {
                            const sublayer = layer.sublayers.find(s => 
                                s.title === "Traffic & Road Closures" || 
                                s.title.includes("Traffic") && s.title.includes("Road")
                            );
                            if (sublayer) {
                                trafficRoadClosuresLayer = sublayer;
                                console.log(`Found Traffic & Road Closures as sublayer in "${layer.title}"`);
                                break;
                            }
                        }
                        // Also check layers property
                        if (layer.layers && layer.layers.length > 0) {
                            const sublayer = layer.layers.find(s => 
                                s.title === "Traffic & Road Closures" || 
                                s.title.includes("Traffic") && s.title.includes("Road")
                            );
                            if (sublayer) {
                                trafficRoadClosuresLayer = sublayer;
                                console.log(`Found Traffic & Road Closures as layer in "${layer.title}"`);
                                break;
                            }
                        }
                    }
                }

                // Store layers in the dictionary using the layerKeys that index.html will use
                // Mapping: website toggle → ArcGIS layer
                
                // Green Spaces & Trees → Bomen
                if (bomenLayer) {
                    layerMap.bomen = bomenLayer;
                    console.log("Found layer: Bomen");
                } else {
                    console.warn("Layer 'Bomen' not found in webmap");
                }

                // Heat Stress → Hittestress
                if (heatLayer) {
                    layerMap.heat = heatLayer;
                    console.log("Found layer: Hittestress");
                } else {
                    console.warn("Layer 'Hittestress' not found in webmap");
                }

                // Public Transport Network → Openbaar Vervoer Nederland
                if (ovLayer) {
                    layerMap.ov = ovLayer;
                    console.log("Found layer: Openbaar Vervoer Nederland");
                } else {
                    console.warn("Layer 'Openbaar Vervoer Nederland' not found in webmap");
                }

                // Traffic Congestion & Dangerous Spots → Traffic & Road Closures
                // This layer may be a top-level layer or a sublayer within a group layer
                if (trafficRoadClosuresLayer) {
                    layerMap.trafficDanger = trafficRoadClosuresLayer;
                    console.log(`Found Traffic & Road Closures layer: "${trafficRoadClosuresLayer.title}" (id: ${trafficRoadClosuresLayer.id}, type: ${trafficRoadClosuresLayer.type || 'sublayer'})`);
                } else {
                    console.warn("Layer 'Traffic & Road Closures' not found in webmap (checked top-level and sublayers)");
                    // Try alternative search - look for any layer with "Traffic" and "Road" in the title
                    const alternativeLayer = map.allLayers.find(l => 
                        l.title && (l.title.toLowerCase().includes("traffic") && l.title.toLowerCase().includes("road"))
                    );
                    if (alternativeLayer) {
                        layerMap.trafficDanger = alternativeLayer;
                        console.log(`Using alternative layer for trafficDanger: "${alternativeLayer.title}"`);
                    } else {
                        // Last resort: search sublayers more broadly
                        for (const layer of map.allLayers.toArray()) {
                            if (layer.sublayers) {
                                const altSublayer = layer.sublayers.find(s => 
                                    s.title && (s.title.toLowerCase().includes("traffic") || s.title.toLowerCase().includes("road"))
                                );
                                if (altSublayer) {
                                    layerMap.trafficDanger = altSublayer;
                                    console.log(`Using alternative sublayer for trafficDanger: "${altSublayer.title}" in "${layer.title}"`);
                                    break;
                                }
                            }
                        }
                    }
                }

                // Construction & Road Closures → Construction
                if (constructionLayer) {
                    layerMap.construction = constructionLayer;
                    console.log("Found layer: Construction");
                } else {
                    console.warn("Layer 'Construction' not found in webmap");
                }

                // Noise Pollution → Noise pollution
                if (noiseLayer) {
                    layerMap.noise = noiseLayer;
                    console.log("Found layer: Noise pollution");
                } else {
                    console.warn("Layer 'Noise pollution' not found in webmap");
                }

                // Demographics → The Hague population density
                if (popDensityLayer) {
                    layerMap.popdensity = popDensityLayer;
                    console.log("Found layer: The Hague population density");
                } else {
                    console.warn("Layer 'The Hague population density' not found in webmap");
                }

                // Note: trafficLayer (title: "Traffic") is kept for backward compatibility
                // but is not currently mapped to any website toggle
                if (trafficLayer) {
                    layerMap.traffic = trafficLayer;
                    console.log("Found layer: Traffic (kept for backward compatibility)");
                } else {
                    console.warn("Layer 'Traffic' not found in webmap");
                }

                // Additional debug: Log final layerMap
                console.log("Final layerMap keys:", Object.keys(layerMap));

                // Initially set all mapped layers to invisible
                Object.values(layerMap).forEach(layer => {
                    if (layer) {
                        layer.visible = false;
                    }
                });

                // ============================================
                // Message Handler: Listen for TOGGLE_LAYER messages from index.html
                // ============================================
                
                window.addEventListener("message", function(event) {
                    const data = event.data;
                    
                    // Only process TOGGLE_LAYER messages
                    if (!data || data.type !== "TOGGLE_LAYER") {
                        return;
                    }

                    const { layerKey, visible } = data;
                    
                    console.log(`Received TOGGLE_LAYER message: layerKey="${layerKey}", visible=${visible}`);

                    // Look up the layer in our layerMap
                    const layer = layerMap[layerKey];
                    
                    if (layer) {
                        // Set the layer visibility
                        layer.visible = visible;
                        
                        // If this is a sublayer, also ensure its parent layer is visible
                        // (sublayers can only be visible if their parent is visible)
                        if (layer.parent) {
                            layer.parent.visible = true;
                            console.log(`Also set parent layer "${layer.parent.title}" to visible for sublayer "${layer.title}"`);
                        }
                        
                        console.log(`Layer "${layer.title}" (key: ${layerKey}) visibility set to ${visible}`);
                    } else {
                        console.warn(`Layer key "${layerKey}" not found in layerMap. Available keys:`, Object.keys(layerMap));
                    }
                });

                // Notify the parent window that the projection map is ready
                if (window.opener) {
                    window.opener.postMessage({ type: "projectionMapReady" }, "*");
                    console.log("Notified parent window that projection map is ready");
                }
            });

            // Wait for the view to load
            view.when(() => {
                console.log("ArcGIS MapView ready");
            }).catch(function(error) {
                console.error("Error loading MapView:", error);
            });
        });
    </script>
</body>
</html>
